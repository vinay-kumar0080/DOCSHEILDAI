apiVersion: v1
kind: ConfigMap
metadata:
  name: docshield-config
  namespace: docshield
  labels:
    app.kubernetes.io/name: docshield-ai
    app.kubernetes.io/part-of: docshield-suite
data:
  # Backend Settings
  ENVIRONMENT: "production"
  PROJECT_NAME: "DocShield AI"
  VERSION: "1.0.0"
  API_V1_STR: "/api/v1"
  DEMO_MODE: "false"
  DOCUMENT_RETENTION_HOURS: "24"
  DATABASE_URL: "sqlite:////app/storage/docshield.db"
  UPLOAD_DIR: "/app/storage/uploads"
  REPORT_DIR: "/app/storage/reports"
  HEATMAP_DIR: "/app/storage/heatmaps"

  # Frontend Settings
  NEXT_PUBLIC_APP_NAME: "DocShield AI"
  NEXT_PUBLIC_API_BASE_URL: "/api/v1"
