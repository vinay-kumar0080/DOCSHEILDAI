apiVersion: apps/v1
kind: Deployment
metadata:
  name: docshield-backend
  namespace: docshield
  labels:
    app: docshield-backend
    app.kubernetes.io/name: docshield-backend
    app.kubernetes.io/component: api-backend
    app.kubernetes.io/part-of: docshield-suite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: docshield-backend
  template:
    metadata:
      labels:
        app: docshield-backend
        app.kubernetes.io/name: docshield-backend
        app.kubernetes.io/component: api-backend
    spec:
      containers:
        - name: docshield-backend
          image: docshield-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: docshield-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: storage-volume
              mountPath: /app/storage
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: docshield-storage-pvc
