services:
  # FastAPI Backend Service
  - type: web
    name: docshield-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: backend
      - key: UPLOAD_DIR
        value: storage/uploads
      - key: REPORT_DIR
        value: storage/reports
      - key: HEATMAP_DIR
        value: storage/heatmaps

  # Next.js Frontend Service
  - type: web
    name: docshield-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: docshield-backend
          property: host
